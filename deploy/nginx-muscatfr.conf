##############################################################################
# Nginx site config — Muscat Fragrances
# Copy to: /etc/nginx/sites-available/muscatfr
# Enable:  ln -s /etc/nginx/sites-available/muscatfr /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
##############################################################################

server {
    listen 80;
    listen [::]:80;

    server_name muscatfragrances.com www.muscatfragrances.com;

    # Redirect HTTP → HTTPS once SSL is set up (uncomment after certbot):
    # return 301 https://$host$request_uri;

    root /var/www/muscatfr/public;
    index index.php index.html;

    charset utf-8;

    # ── Logging ────────────────────────────────────────────────────────────
    access_log /var/log/nginx/muscatfr.access.log;
    error_log  /var/log/nginx/muscatfr.error.log;

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Static assets ──────────────────────────────────────────────────────
    location ~* \.(css|js|woff2?|ttf|eot|otf|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Laravel front controller ───────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── PHP-FPM ───────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 60;
    }

    # ── Block .env and dot-files ───────────────────────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ── Upload size ────────────────────────────────────────────────────────
    client_max_body_size 20M;
}

# HTTPS block — Certbot will fill this in automatically.
# To get a free SSL cert, run:
#   sudo certbot --nginx -d muscatfragrances.com -d www.muscatfragrances.com
